<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DuneSight: measured sand-dune motion at three UAE sites and which roads, farms and built-up areas the moving sand reaches." />
    <meta name="theme-color" content="#15130F" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D8C3A0' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M2 17.5c3.2-5 6.4-6.2 9.5-3s6.8 2.6 10.5-3'/%3E%3Cpath d='M2 11.5c2.4-3.4 4.8-4.2 7.2-2.2'/%3E%3C/svg%3E" />
    <title>DuneSight</title>
  </head>
  <body>
    <!-- The UI (src/ui/ui.js) mounts into #app over the globe and lets clicks through to it outside its panels. -->
    <div id="app">
      <div id="globe"></div>
    </div>
    <!-- Cesium writes its credits here; the UI moves this node into its footer. -->
    <div id="cesium-credits"></div>

    <div id="basemap-note" class="ds-toast" role="status" hidden></div>
    <div id="error-note" class="ds-toast ds-toast--error" role="alert" hidden></div>
    <div id="dossier" class="overlay" hidden></div>
    <div id="boot" class="boot"><span>DuneSight</span><small>Loading site data</small></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
